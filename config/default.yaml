# Default configuration for the football tracking pipeline.
video:
  source: "data/sample.mp4"        # Path to input video file.

model:
  player_detector: "models/player_detector.onnx"    # YOLO model for player detection.
  detection_conf: 0.3              # Minimum confidence for player and ball detections.
  device: "auto"                   # "auto" = CUDA if available, else CPU.
  half: null                       # null = FP16 on CUDA, FP32 on CPU. FP16 parity: recall ≥ 0.998, IoU 0.979/0.956 (accepted).

pipeline:
  display: true                    # Show annotated video in window.
  output_video: null               # Path for annotated output video (null = skip).
  output_json: null                # Path for per-frame JSON output (null = skip).

team_classifier:
  enabled: true                    # Whether to classify teams by jersey color.
  fit_frames: 50                   # Number of frames to sample for k-means fitting.

ball_detector:
  enabled: true                    # Whether to detect and track the ball.
  model: "models/ball_detector.onnx"             # Model for ball detection.
  max_lost_frames: 15              # Frames before declaring ball lost.
  gate_px: 150.0                   # Ignore ball detections farther than this (px) from the predicted position.

shot_detector:
  angle_threshold: 30.0            # Minimum velocity direction change (degrees) over 0.25 s.
  accel_threshold: 800.0           # Minimum mean acceleration over 0.25 s (image px/s², uses the video's fps).

calibration:
  enabled: true                    # Pitch calibration + speed (4 clicks; only when display is on). Assumes a static camera.
  speed_window: 12                 # Frames to smooth speed/direction over.
  camera_dir: null                 # SynLoc camera model directory (null=manual clicks).

timeline:
  enabled: true                         # Build offline tactical timeline.
  max_ball_player_distance_px: 80.0     # Max pixel distance for possession.
  min_possession_frames: 3              # Frames needed to confirm possession.
  output_json: null                     # Optional tactical timeline path.
  benchmark_json: null                   # Optional stage timing report path.
