project:
  title: "Pipeline throughput for offline football analysis"
  question: >
    Where does per-frame time go in the full pipeline (player track + ball + team + timeline)
    on an RTX 3050 Ti Laptop, and which changes cut end-to-end ms/frame without changing
    detection output beyond the accepted FP16 tolerance?
  status: active
  started: "2026-10-19"
  domain: "inference systems / video analytics"

literature:
  key_papers:
    - id: ultralytics-yolo26-speed
      title: "Ultralytics YOLO26 detection benchmarks"
      relevance: "YOLO26s 2.5 ms/frame at 640 on T4 TensorRT10; our player_track was 33 ms at 960"
    - id: ort-trt-ep
      title: "ONNX Runtime TensorRT / CUDA execution providers"
      relevance: "TRT EP runs the existing fixed-shape ONNX files without the original .pt"
  open_problems:
    - "gap between published detector latency and measured player_track"

hypotheses:
  - id: H1
    statement: "Raw player session.run <= 12 ms and <= 40% of player_track; the rest is Ultralytics/copies/OC-SORT."
    status: refuted        # 14.9 ms, 55%
    priority: high
  - id: H2
    statement: "Raw ball session.run >= 60% of ball_detect."
    status: supported      # 83%
    priority: high
  - id: H3
    statement: "TensorRT FP16 (ORT TRT EP) cuts raw inference >= 2x for both models with parity."
    status: inconclusive   # 1.7-1.8x with parity: real gain, below 2x
    priority: high
  - id: H3b
    statement: "TRT EP for both detectors cuts end-to-end ms/frame >= 20% with output guards holding."
    status: supported      # -23.8%, guards hold; shipped
    parent: H3
    priority: high
  - id: H4
    statement: "Running ball detection in parallel with player tracking hides >= 25% of its cost (GPU idle during CPU pre/post)."
    status: supported      # -3.1 ms/frame (~35% of ball cost), identical outputs; shipped
    priority: high
  - id: H5
    statement: "Moving video encode (8.3 ms) off the main loop removes it from ms/frame when output_video is set."
    status: pending        # deprioritised: H8 shows the CPU is saturated; encode is only on when output_video is set
    priority: low
  - id: H6
    statement: "OC-SORT costs >= 5 ms/frame on CPU, dominated by per-track Python work."
    status: supported      # ~6.5-9 ms (cProfile)
    priority: medium
  - id: H6b
    statement: "ByteTrack/FastTrack cut >= 2 ms with IDF1 within 2 points and ID switches <= 1.2x OC-SORT (SportsMOT football GT)."
    status: refuted        # ByteTrack -3.2..-4.2 ms but 1.35x ID switches; keep OC-SORT
    parent: H6
    priority: medium
  - id: H7
    statement: "Ultralytics pre/post adds >= 4 ms around the session."
    status: supported      # 5.9 ms; CPU letterbox 3.1 ms is the largest piece
    priority: medium
  - id: H8
    statement: "Re-enabling OpenCV threading (disabled by Ultralytics) cuts >= 1.5 ms with identical outputs."
    status: refuted        # mean +2.5 ms and unstable: CPU oversubscription
    priority: medium
  - id: H7b
    statement: "Letterbox on the GPU (torch resize+pad of the uploaded uint8 frame) removes ~3 ms CPU per player call with detection parity."
    status: pending
    parent: H7
    priority: high
  - id: H9
    statement: "Player detector at imgsz 768 instead of 960 cuts >= 3 ms/frame with IDF1 drop <= 1 point on SportsMOT football."
    status: pending
    priority: medium

experiments:
  proxy_metric: >
    End-to-end ms/frame of Pipeline.run on data/sample.mp4 (1505 frames, 1280x720, 25 fps),
    default config with display=false, output_video=null, JSON+timeline on; wall time of run()
    divided by frames, model load excluded. Runs interleaved (B/T/B/T) because single runs drift ~20%.
    Guard: player recall >= 0.99 at IoU 0.5 vs baseline, ball in-play rate within 2 pp, shots compared.
  baseline_value: 52.31   # ms/frame, run_003 B mean
  best_value: 36.93       # run_004 P mean (TRT + parallel ball), shipped
  total_runs: 7
  trajectory:
    - {run_id: run_001, hypothesis: H1/H2, metric_value: null, change_summary: "latency breakdown (no pipeline change)"}
    - {run_id: run_002, hypothesis: H3, metric_value: null, change_summary: "raw TRT vs CUDA: player 14.77->8.10, ball 22.64->13.30 ms"}
    - {run_id: run_003, hypothesis: H3b, metric_value: 39.85, baseline: 52.31, delta: "-23.8%", change_summary: "TRT EP for both detectors (shipped)"}
    - {run_id: run_004, hypothesis: H4, metric_value: 36.93, baseline: 40.05, delta: "-7.8%", change_summary: "ball detection overlapped with player tracking (shipped)"}
    - {run_id: run_005, hypothesis: H6/H7, metric_value: null, change_summary: "cProfile: OC-SORT ~8 ms, CPU letterbox ~3 ms"}
    - {run_id: run_006, hypothesis: H6b, metric_value: null, change_summary: "ByteTrack -4 ms but +35% ID switches: rejected"}
    - {run_id: run_007, hypothesis: H8, metric_value: 40.58, baseline: 38.04, delta: "+6.7%", change_summary: "cv2 16 threads: contention, rejected"}

outer_loop:
  cycle: 2
  last_direction: deepen
  last_reflection: >
    52.3 -> 36.9 ms/frame (-29.4%) shipped with baseline-equal outputs. After TensorRT the bottleneck is CPU,
    not GPU, and the CPU is saturated: parallelising more CPU work (H8) backfires, and swapping in a cheaper
    tracker costs identity quality (H6b). Remaining levers must remove work: GPU letterbox (H7b), smaller
    player input with a GT guard (H9), or a vectorised OC-SORT with identical outputs.
