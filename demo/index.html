<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Tracker Demo</title>
<style>
  body { font-family: system-ui; max-width: 900px; margin: 20px auto; padding: 0 16px; background: #111; color: #eee; }
  input, button { font-size: 16px; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; }
  input { width: 100%; box-sizing: border-box; }
  button { background: #2563eb; border-color: #2563eb; cursor: pointer; margin-top: 8px; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin: 12px 0; font-size: 14px; color: #9ca3af; }
  #img { width: 100%; border-radius: 8px; border: 1px solid #333; display: none; }
  #stats { font-size: 13px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>

<h1>Football Tracker Demo</h1>

<input id="url" type="text" placeholder="Paste YouTube URL...">
<button id="start" onclick="start()">Analyze</button>
<div id="status"></div>
<img id="img">
<div id="stats"></div>

<script>
const API = "http://localhost:8000";

async function start() {
  const url = document.getElementById("url").value.trim();
  if (!url) return;

  const btn = document.getElementById("start");
  btn.disabled = true;
  document.getElementById("status").textContent = "Downloading...";

  const res = await fetch(`${API}/v1/analyze`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url }),
  });
  const data = await res.json();

  if (data.status !== "success") {
    document.getElementById("status").textContent =
      "Error: " + JSON.stringify(data.error);
    btn.disabled = false;
    return;
  }

  const sid = data.result.session_id;
  document.getElementById("img").src = `${API}/v1/stream/${sid}`;
  document.getElementById("img").style.display = "block";
  document.getElementById("status").textContent = "Streaming...";

  const timer = setInterval(async () => {
    const p = await fetch(`${API}/v1/progress/${sid}`);
    const pd = await p.json();
    document.getElementById("stats").textContent =
      `Frame ${pd.result.processed}/${pd.result.total}`;
  }, 1000);
}
</script>
</body>
</html>
